# Workspace pnpm : mutualise le store → une SEULE copie physique des deps partagées
# (yjs DOIT être un singleton, sinon « Yjs was already imported »).
# L'app reste gérée par npm (non listée ici) ; côté navigateur, le dédoublonnage
# yjs est assuré par `resolve.dedupe` dans vite.config.
packages:
  - server
  - packages/*

# esbuild (via tsx) est le seul build script approuvé : sans cette liste, pnpm 10
# l'ignore à l'install (warning) puis ÉCHOUE à la vérification des deps au
# premier `pnpm start` sur une machine neuve (ERR_PNPM_IGNORED_BUILDS).
onlyBuiltDependencies:
  - esbuild

# Pas de re-vérification des deps à chaque `pnpm run` : sur une machine de déploiement
# l'état installé fait foi, et ce check refusait de démarrer tant qu'il jugeait le
# node_modules « périmé » (boucle ERR_PNPM_IGNORED_BUILDS sur Chappie).
verifyDepsBeforeRun: false
